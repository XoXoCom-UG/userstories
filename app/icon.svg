<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <!-- The User Story Schneider mark (components/brand-logo.tsx): one story card
       cut corner to corner into two pieces. The tile is part of the mark so it
       keeps its contrast on a light tab bar; no glow, which is mud at 16px. -->
  <defs>
    <linearGradient id="tile" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F2D33"/><stop offset="1" stop-color="#0A0F13"/>
    </linearGradient>
    <linearGradient id="a" x1="10" y1="10" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9BF5DC"/><stop offset="1" stop-color="#1FA98A"/>
    </linearGradient>
    <linearGradient id="b" x1="30" y1="14" x2="15" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FC2FF"/><stop offset="1" stop-color="#2E7BC4"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="10" fill="url(#tile)"/>
  <path d="M10.5,10.5 L26,10.5 L10.5,26 Z" fill="url(#a)" stroke="url(#a)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M29.9,29.9 L14.4,29.9 L29.9,14.4 Z" fill="url(#b)" stroke="url(#b)" stroke-width="3" stroke-linejoin="round"/>
</svg>
